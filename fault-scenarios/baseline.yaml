# Healthy state of every component the scenarios touch. run.sh passes this file
# on every helm upgrade, so each scenario starts from here even when an earlier
# one was rolled back with kubectl instead of helm.
components:
  product-catalog:
    imageOverride:
      repository: ghcr.io/open-telemetry/demo
      tag: 3.1.0-product-catalog
    envOverrides: []
  frontend:
    envOverrides:
      - name: CART_ADDR
        valueFrom:
          configMapKeyRef:
            name: frontend-config
            key: CART_ADDR
  checkout:
    imageOverride:
      repository: ghcr.io/open-telemetry/demo
      tag: 3.1.0-checkout
  payment:
    resources:
      limits:
        memory: 140Mi
  email:
    imageOverride:
      repository: ghcr.io/open-telemetry/demo
      tag: 3.1.0-email
