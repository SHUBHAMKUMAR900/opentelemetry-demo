apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency
  namespace: otel-demo
  labels:
    app: currency
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency
  template:
    metadata:
      labels:
        app: currency
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: currency
        image: asia-south1-docker.pkg.dev/ct-lens/otel/currency:v1.1.19
        ports:
        - name: port-7001
          containerPort: 7001
        env:
        - name: CURRENCY_PORT
          value: '7001'
        - name: IPV6_ENABLED
          value: 'false'
        - name: VERSION
          value: 3.1.0
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=high
        - name: OTEL_SERVICE_NAME
          value: currency
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 7001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 7001
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: currency
  namespace: otel-demo
  labels:
    app: currency
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: currency
  ports:
  - name: port-7001
    port: 7001
    targetPort: 7001
