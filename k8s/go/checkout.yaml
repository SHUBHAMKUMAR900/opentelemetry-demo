apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: otel-demo
  labels:
    app: checkout
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: checkout
        image: asia-south1-docker.pkg.dev/ct-lens/otel/checkout:v1.1.9
        ports:
        - name: port-5050
          containerPort: 5050
        env:
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: CHECKOUT_PORT
          value: '5050'
        - name: CART_ADDR
          value: cart:7070
        - name: CURRENCY_ADDR
          value: currency:7001
        - name: EMAIL_ADDR
          value: http://email:6060
        - name: PAYMENT_ADDR
          value: payment:50051
        - name: PRODUCT_CATALOG_ADDR
          value: product-catalog:3550
        - name: SHIPPING_ADDR
          value: http://shipping:50050
        - name: GOMEMLIMIT
          value: 16MiB
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: OTEL_GO_X_OBSERVABILITY
          value: 'true'
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=critical
        - name: OTEL_SERVICE_NAME
          value: checkout
        - name: KAFKA_ADDR
          value: kafka:9092
        - name: KAFKA_TOPIC
          value: orders
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 5050
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5050
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: otel-demo
  labels:
    app: checkout
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: checkout
  ports:
  - name: port-5050
    port: 5050
    targetPort: 5050
