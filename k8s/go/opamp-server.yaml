apiVersion: apps/v1
kind: Deployment
metadata:
  name: opamp-server
  namespace: otel-demo
  labels:
    app: opamp-server
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opamp-server
  template:
    metadata:
      labels:
        app: opamp-server
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: opamp-server
        image: asia-south1-docker.pkg.dev/ct-lens/otel/opamp-server:v1.1.6
        ports:
        - name: port-4320
          containerPort: 4320
        - name: port-4321
          containerPort: 4321
        env: []
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 65Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 4320
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 4320
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: opamp-server
  namespace: otel-demo
  labels:
    app: opamp-server
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: opamp-server
  ports:
  - name: port-4320
    port: 4320
    targetPort: 4320
  - name: port-4321
    port: 4321
    targetPort: 4321
