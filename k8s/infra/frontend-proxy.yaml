apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
  namespace: otel-demo
  labels:
    app: frontend-proxy
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-proxy
  template:
    metadata:
      labels:
        app: frontend-proxy
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: frontend-proxy
        image: asia-south1-docker.pkg.dev/ct-lens/otel/frontend-proxy:v1.1.11
        ports:
        - name: port-8080
          containerPort: 8080
        - name: port-10000
          containerPort: 10000
        env:
        - name: FRONTEND_PORT
          value: '8080'
        - name: FRONTEND_HOST
          value: frontend
        - name: LOCUST_WEB_HOST
          value: load-generator
        - name: LOCUST_WEB_PORT
          value: '8089'
        - name: GRAFANA_PORT
          value: '3000'
        - name: GRAFANA_HOST
          value: grafana
        - name: JAEGER_UI_PORT
          value: '16686'
        - name: JAEGER_HOST
          value: jaeger
        - name: OPAMP_SERVER_HOST
          value: opamp-server
        - name: OPAMP_SERVER_UI_PORT
          value: '4321'
        - name: OTEL_COLLECTOR_HOST
          value: otel-collector
        - name: IMAGE_PROVIDER_HOST
          value: image-provider
        - name: IMAGE_PROVIDER_PORT
          value: '8081'
        - name: OTEL_COLLECTOR_PORT_GRPC
          value: '4317'
        - name: OTEL_COLLECTOR_PORT_HTTP
          value: '4318'
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=critical
        - name: OTEL_SERVICE_NAME
          value: frontend-proxy
        - name: OTEL_SERVICE_NAMESPACE
          value: opentelemetry-demo
        - name: ENVOY_PORT
          value: '8080'
        - name: ENVOY_ADDR
          value: 0.0.0.0
        - name: ENVOY_ADMIN_PORT
          value: '10000'
        - name: FIREPIT_HOST
          value: firepit
        - name: FIREPIT_PORT
          value: '8080'
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: FLAGD_UI_HOST
          value: flagd-ui
        - name: FLAGD_UI_PORT
          value: '4000'
        - name: TELEMETRY_DOCS_HOST
          value: telemetry-docs
        - name: TELEMETRY_DOCS_PORT
          value: '8000'
        - name: CHATBOT_HOST
          value: chatbot
        - name: CHATBOT_PORT
          value: '7860'
        resources:
          requests:
            cpu: 50m
            memory: 45Mi
          limits:
            memory: 90Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-proxy
  namespace: otel-demo
  labels:
    app: frontend-proxy
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: frontend-proxy
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
  - name: port-10000
    port: 10000
    targetPort: 10000
