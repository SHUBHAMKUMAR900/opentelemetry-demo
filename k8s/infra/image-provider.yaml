apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-provider
  namespace: otel-demo
  labels:
    app: image-provider
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-provider
  template:
    metadata:
      labels:
        app: image-provider
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: image-provider
        image: asia-south1-docker.pkg.dev/ct-lens/otel/image-provider:v1.1.11
        ports:
        - name: port-8081
          containerPort: 8081
        env:
        - name: IMAGE_PROVIDER_PORT
          value: '8081'
        - name: OTEL_COLLECTOR_HOST
          value: otel-collector
        - name: OTEL_COLLECTOR_PORT_GRPC
          value: '4317'
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=low
        - name: OTEL_SERVICE_NAME
          value: image-provider
        resources:
          requests:
            cpu: 50m
            memory: 60Mi
          limits:
            memory: 120Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: image-provider
  namespace: otel-demo
  labels:
    app: image-provider
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: image-provider
  ports:
  - name: port-8081
    port: 8081
    targetPort: 8081
