apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: otel-demo
  labels:
    app: recommendation
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation
  template:
    metadata:
      labels:
        app: recommendation
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: recommendation
        image: asia-south1-docker.pkg.dev/ct-lens/otel/recommendation:v1.1.13
        ports:
        - name: port-9001
          containerPort: 9001
        env:
        - name: RECOMMENDATION_PORT
          value: '9001'
        - name: PRODUCT_CATALOG_ADDR
          value: product-catalog:3550
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=medium
        - name: OTEL_SERVICE_NAME
          value: recommendation
        - name: OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION
          value: latest
        - name: _JAVA_OPTIONS
          value: ''
        resources:
          requests:
            cpu: 50m
            memory: 250Mi
          limits:
            memory: 500Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation
  namespace: otel-demo
  labels:
    app: recommendation
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: recommendation
  ports:
  - name: port-9001
    port: 9001
    targetPort: 9001
