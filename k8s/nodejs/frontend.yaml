apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: otel-demo
  labels:
    app: frontend
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: frontend
        image: asia-south1-docker.pkg.dev/ct-lens/otel/frontend:v1.1.14
        ports:
        - name: port-8080
          containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: FRONTEND_ADDR
          value: frontend:8080
        - name: AD_ADDR
          value: ad:9555
        - name: CART_ADDR
          value: cart:7070
        - name: CHECKOUT_ADDR
          value: checkout:5050
        - name: CURRENCY_ADDR
          value: currency:7001
        - name: PRODUCT_CATALOG_ADDR
          value: product-catalog:3550
        - name: RECOMMENDATION_ADDR
          value: recommendation:9001
        - name: SHIPPING_ADDR
          value: http://shipping:50050
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=critical
        - name: ENV_PLATFORM
          value: local
        - name: OTEL_SERVICE_NAME
          value: frontend
        - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://localhost:8080/otlp-http/v1/traces
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: WEB_OTEL_SERVICE_NAME
          value: frontend-web
        - name: OTEL_COLLECTOR_HOST
          value: otel-collector
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        resources:
          requests:
            cpu: 100m
            memory: 125Mi
          limits:
            memory: 250Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: otel-demo
  labels:
    app: frontend
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: frontend
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
