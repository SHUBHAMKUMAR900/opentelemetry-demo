apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: otel-demo
  labels:
    app: payment
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: payment
        image: asia-south1-docker.pkg.dev/ct-lens/otel/payment:v1.1.14
        ports:
        - name: port-50051
          containerPort: 50051
        env:
        - name: IPV6_ENABLED
          value: 'false'
        - name: PAYMENT_PORT
          value: '50051'
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: NODE_OPTIONS
          value: --require @opentelemetry/auto-instrumentations-node/register
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=critical
        - name: OTEL_SERVICE_NAME
          value: payment
        resources:
          requests:
            cpu: 50m
            memory: 70Mi
          limits:
            memory: 140Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: otel-demo
  labels:
    app: payment
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: payment
  ports:
  - name: port-50051
    port: 50051
    targetPort: 50051
