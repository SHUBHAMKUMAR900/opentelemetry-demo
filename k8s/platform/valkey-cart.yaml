apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-cart
  namespace: otel-demo
  labels:
    app: valkey-cart
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-cart
  template:
    metadata:
      labels:
        app: valkey-cart
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: valkey-cart
        image: ghcr.io/valkey-io/valkey:9.1.2-alpine3.24
        ports:
        - name: port-6379
          containerPort: 6379
        env: []
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-cart
  namespace: otel-demo
  labels:
    app: valkey-cart
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: valkey-cart
  ports:
  - name: port-6379
    port: 6379
    targetPort: 6379
