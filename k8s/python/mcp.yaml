apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: otel-demo
  labels:
    app: mcp
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: mcp
        image: asia-south1-docker.pkg.dev/ct-lens/otel/mcp:v1.1.12
        ports:
        - name: port-8011
          containerPort: 8011
        env:
        - name: TRACELOOP_BASE_URL
          value: http://otel-collector:4318
        - name: MCP_ENDPOINT
          value: mcp
        - name: MCP_PORT
          value: '8011'
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: APPLICATION_ENDPOINT
          value: frontend:8080
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=low
        - name: OTEL_SERVICE_NAME
          value: mcp
        - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
          value: 'true'
        resources:
          requests:
            cpu: 50m
            memory: 250Mi
          limits:
            memory: 500Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 8011
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8011
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: otel-demo
  labels:
    app: mcp
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: mcp
  ports:
  - name: port-8011
    port: 8011
    targetPort: 8011
