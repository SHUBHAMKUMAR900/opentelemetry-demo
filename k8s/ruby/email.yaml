apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  namespace: otel-demo
  labels:
    app: email
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: email
        image: asia-south1-docker.pkg.dev/ct-lens/otel/email:v1.1.15
        ports:
        - name: port-6060
          containerPort: 6060
        env:
        - name: APP_ENV
          value: production
        - name: EMAIL_PORT
          value: '6060'
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=medium
        - name: OTEL_SERVICE_NAME
          value: email
        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 6060
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 6060
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: email
  namespace: otel-demo
  labels:
    app: email
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: email
  ports:
  - name: port-6060
    port: 6060
    targetPort: 6060
