apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: otel-demo
  labels:
    app: shipping
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      enableServiceLinks: false
      containers:
      - name: shipping
        image: asia-south1-docker.pkg.dev/ct-lens/otel/shipping:v1.1.18
        ports:
        - name: port-50050
          containerPort: 50050
        env:
        - name: IPV6_ENABLED
          value: 'false'
        - name: SHIPPING_PORT
          value: '50050'
        - name: QUOTE_ADDR
          value: http://quote:8090
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: '8013'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo,service.version=3.1.0,service.criticality=high
        - name: OTEL_SERVICE_NAME
          value: shipping
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
          value: explicit_bucket_histogram
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          tcpSocket:
            port: 50050
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 50050
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: otel-demo
  labels:
    app: shipping
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app: shipping
  ports:
  - name: port-50050
    port: 50050
    targetPort: 50050
